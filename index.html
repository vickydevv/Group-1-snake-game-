
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Snake Game</title>

  <link rel="stylesheet" href="Stlye.Css" />
</head>
<body>

  <div class="container">
    <h1>🐍 Snake Game</h1>

    <div class="mode-buttons">
      <button onclick="startGame(1)">Mode 1 - No Wall Death</button>
      <button onclick="startGame(2)">Mode 2 - Classic</button>
    </div>

    <h2 id="modeText">Choose a Mode</h2>

    <div class="game-area">
      <canvas id="gameCanvas" width="480" height="480"></canvas>

      <!-- On-screen controls for phones and tablets -->
      <div class="controls" id="touchControls" aria-label="Direction controls">
        <button type="button" class="ctrl-btn ctrl-up" data-dir="UP" aria-label="Up">▲</button>
        <button type="button" class="ctrl-btn ctrl-left" data-dir="LEFT" aria-label="Left">◀</button>
        <button type="button" class="ctrl-btn ctrl-down" data-dir="DOWN" aria-label="Down">▼</button>
        <button type="button" class="ctrl-btn ctrl-right" data-dir="RIGHT" aria-label="Right">▶</button>
      </div>
    </div>

    <p class="mobile-hint">On phone: use buttons below or swipe on the game board</p>
    <h3 id="score">Score: 0</h3>
  </div>

  <script src="Index.js"></script>
</body>
</html>
